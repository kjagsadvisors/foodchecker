# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Authenticates with GitHub OIDC, so no secrets are needed. Run it from the Actions tab
# or push a tag such as v0.1.1 after bumping the version in server.json.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -sSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
